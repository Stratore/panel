name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high
      # End-to-end (SPEC § 12): real API on demo data behind the production front-end build.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker stack (${{ matrix.arch }})
    # GitHub-hosted runners only: never a self-hosted runner on a public repository.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test configuration (throw-away values)
        run: |
          umask 077
          {
            echo "PANEL_HOST=localhost"
            echo "PANEL_BIND_ADDR=127.0.0.1"
            echo "PANEL_PUBLIC_URL=https://localhost"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "SETUP_TOKEN=$(openssl rand -hex 16)"
            echo "TZ=Europe/Paris"
          } > .env
      - name: Build images
        run: docker compose -f compose.yaml -f compose.build.yaml build
      - name: Start the stack
        run: docker compose -f compose.yaml -f compose.build.yaml up -d --wait --wait-timeout 240
      - name: Check hardening, headers and routing
        run: bash scripts/check.sh
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep panel
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - run: ./gitleaks git --redact --no-banner --exit-code 1
